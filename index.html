<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202821">
  <title>Untuk Mutia</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #202821;
      font-family: "Segoe UI", sans-serif;
    }

    .opening {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .opening::before,
    .opening::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
    }

    .opening::before {
      background: url("asset/IMG-20230131-WA0010.jpg") center / contain no-repeat;
      animation: reveal 1.1s ease-out both;
    }

    .opening::after {
      background: linear-gradient(180deg, rgba(20, 27, 22, 0.1) 25%, rgba(20, 27, 22, 0.2) 55%, rgba(20, 27, 22, 0.72) 100%);
    }

    .continue {
      position: absolute;
      right: max(28px, calc((100vw - 1120px) / 2));
      bottom: max(34px, 8vh);
      display: inline-flex;
      min-width: 154px;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 22px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      background: rgba(25, 32, 27, 0.18);
      color: #fff;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-decoration: none;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      transition: background-color 180ms ease, color 180ms ease, transform 180ms ease;
      animation: rise 700ms 250ms ease-out both;
    }

    .continue::after {
      width: 22px;
      height: 1px;
      background: currentColor;
      content: "";
      transition: width 180ms ease;
    }

    .continue:hover {
      transform: translateY(-2px);
      background: #f2f0e9;
      color: #202821;
    }

    .continue:hover::after { width: 30px; }
    .continue:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }

    body.is-leaving .opening {
      animation: depart 360ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      pointer-events: none;
    }

    @keyframes reveal {
      from { opacity: 0.65; }
      to { opacity: 1; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes depart {
      to { opacity: 0; transform: translateY(-8px) scale(0.99); filter: blur(2px); }
    }

    @media (max-width: 600px) {
      .continue { right: 24px; bottom: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="opening">
    <a class="continue" href="card.html">Lanjut</a>
  </main>
  <script>
    const continueLink = document.querySelector(".continue");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    continueLink.addEventListener("click", (event) => {
      if (prefersReducedMotion || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      event.preventDefault();
      document.body.classList.add("is-leaving");
      window.setTimeout(() => {
        window.location.href = continueLink.href;
      }, 360);
    });
  </script>
</body>
</html>
